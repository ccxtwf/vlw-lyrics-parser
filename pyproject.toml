[project]
name = "vlw-lyrics-parser"
version = "0.0.1"
description = "Lyrics parser for the Vocaloid Lyrics Wiki"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "asyncio>=4.0.0",
    "dateparser>=1.3.0",
    "lupa>=2.6",
    "lxml>=6.0.2",
    "mediawiki-langcodes>=0.2.18",
    "psutil>=7.2.2",
    "pydantic>=2.12.5",
    "pyquery>=2.0.1",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "rich>=14.3.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
